build_src_filter = +<differential_drive_test.cpp> -<main.cpp> -<encoder_test.cpp> -<pin_test.cpp> -<calibration_test.cpp> -<pid_tuner.cpp> -<motor_encoder_test.cpp> -<velocity_control_test.cpp>
